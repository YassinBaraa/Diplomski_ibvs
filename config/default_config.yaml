# IBVS Pipeline Configuration

# Source Configuration
source:
  type: "detection"  # "mp4" or "detection"
  video_path: "sources/apriltag_test.mp4"  # Path to video file

# Feature Extraction Configuration (FAST + Harris)
feature_extraction:
  max_features: 80
  fast_threshold: 20
  harris_block_size: 2
  harris_ksize: 3
  harris_k: 0.04
  point_focus_radius: 80  # Applied only after warmup; filters features to branch region

# Controller / Tracker
controller:
  main_gain: 0.5
  min_features: 8  # Minimum tracked features before re-extracting


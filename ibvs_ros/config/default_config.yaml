# IBVS Pipeline Configuration

# Source Configuration
source:
  type: "mp4"  # "mp4" or "detection"
  video_path: "sources/apriltag_test.mp4"  # Path to video file

# Feature Extraction Configuration (FAST + Harris)
feature_extraction:
  max_features: 80
  fast_threshold: 20
  harris_block_size: 2
  harris_ksize: 3
  harris_k: 0.04
  point_focus_radius: null  # Optional: focus on target point with this radius (pixels)

